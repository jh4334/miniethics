    <circle cx="204" cy="230" r="20" fill="#3a3352"/>
    <circle cx="308" cy="230" r="20" fill="#3a3352"/>
    <circle cx="210" cy="224" r="7" fill="#fff"/>
    <circle cx="314" cy="224" r="7" fill="#fff"/>
