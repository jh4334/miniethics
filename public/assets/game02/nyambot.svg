    <rect x="90" y="238" width="14" height="70" rx="7" fill="#b0bec5"/>
    <path d="M84 238 v-30 M97 238 v-34 M110 238 v-30" stroke="#b0bec5" stroke-width="9" stroke-linecap="round"/>
